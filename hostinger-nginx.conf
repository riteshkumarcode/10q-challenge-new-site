# ==============================================================================
# Hostinger VPS Nginx Configuration for 10Q Challenge Platform
# Save to: /etc/nginx/sites-available/10qchallenge
# Enable:  ln -s /etc/nginx/sites-available/10qchallenge /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx
# ==============================================================================

# Upstream Node.js application (PM2 or standalone cluster on port 3000)
upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 1. HTTP Server - Redirects all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 10qchallenge.in www.10qchallenge.in;

    # Let's Encrypt validation path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 10qchallenge.in www.10qchallenge.in;

    # SSL Certificate Paths (Managed via Certbot)
    # ssl_certificate /etc/letsencrypt/live/10qchallenge.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/10qchallenge.in/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum upload size (adjust if uploading large exam materials or PDFs)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Next.js Static Files & Chunks (High performance caching)
    location /_next/static/ {
        alias /var/www/10qchallenge/frontend/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static assets (images, icons, robots, sitemap)
    location /site/ {
        alias /var/www/10qchallenge/frontend/public/site/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /favicon.ico {
        root /var/www/10qchallenge/frontend/public;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy all dynamic requests to Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
